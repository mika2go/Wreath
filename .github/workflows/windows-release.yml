name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.2.15
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          $NsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path -LiteralPath (Join-Path $NsisDirectory 'makensis.exe'))) {
            throw "Chocolatey did not install makensis.exe below $NsisDirectory"
          }
          $NsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test NSIS installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version '${{ inputs.version }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wreath-${{ inputs.version }}-Windows-x64
          path: |
            dist/windows/Wreath-${{ inputs.version }}-x64-setup.exe
            dist/windows/Wreath-${{ inputs.version }}-x64-build.json
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $Tag = "v$env:RELEASE_VERSION"
          gh release create $Tag `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-setup.exe" `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-build.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Wreath $env:RELEASE_VERSION" `
            --notes "Windows x64 NSIS microphone-quality hotfix, continuing 0.2.14, aimed at the last of the residual grit. The mixer no longer re-derives the microphone alignment from timestamps for every desktop packet. The two endpoints run on separate crystals, and the old code truncated two independent durations to whole frames, so whenever the sub-sample phase between the streams crossed a frame boundary the microphone repeated or skipped one sample - a few times a second at ordinary drift, each one a step in the waveform. The microphone is now buffered as one contiguous stream whose alignment is established once and then held by consuming exactly as many frames as each desktop packet covers; it is re-derived only when the streams have genuinely walked more than 10 ms apart, and that correction is faded in. Holes in the buffered microphone stream are bridged with silence instead of splicing and shifting everything behind them. Every fixed-point scaling in the mix chain now rounds instead of truncating toward zero: truncation is a signal-correlated error, so each attenuation was adding its own faint layer of harmonic distortion rather than a benign fraction of a bit. AAC now encodes at 192 kbit/s, the highest rate the Microsoft encoder accepts, because AAC-LC at 128 kbit/s is not transparent on stereo material and speech over game audio is exactly the broadband content its artefacts show up on. Native Windows tests, clippy, release builds, application launch/resize, running-upgrade, NSIS install, and process-cleanup uninstall gates pass; the full AMD/Intel/NVIDIA Medal performance matrix is still pending."
