name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.2.16
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          $NsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path -LiteralPath (Join-Path $NsisDirectory 'makensis.exe'))) {
            throw "Chocolatey did not install makensis.exe below $NsisDirectory"
          }
          $NsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test NSIS installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version '${{ inputs.version }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wreath-${{ inputs.version }}-Windows-x64
          path: |
            dist/windows/Wreath-${{ inputs.version }}-x64-setup.exe
            dist/windows/Wreath-${{ inputs.version }}-x64-build.json
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $Tag = "v$env:RELEASE_VERSION"
          gh release create $Tag `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-setup.exe" `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-build.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Wreath $env:RELEASE_VERSION" `
            --notes "Windows x64 NSIS clip-size release. Replay clips were far larger than they needed to be for two reasons. The encoder was never told which rate control mode to use, and Media Foundation hardware encoders default to constant bitrate, so a still menu or a static desktop spent exactly as many bits as a fast pan. Wreath now asks for peak-constrained variable bitrate with the target as the mean and 50 percent headroom as the peak, plus a quality-leaning speed bias, all best effort and logged when an encoder refuses. The bitrate model itself also asked for roughly twice what a hardware encoder needs to look good - about 0.2 bits per pixel at the default quality, where 0.08 to 0.10 is the usual operating point and what streaming services ask for. At the default quality a 30 second clip is now roughly 37 MB at 1080p60, 66 MB at 1440p60 and 149 MB at 2160p60, against 75, 133 and 300 MB before, and variable bitrate takes typical content further below that. The quality setting scales around the new operating point, so 100 still reaches most of the old headroom. Switching to hevc saves about another third. Native Windows tests, clippy, release builds, application launch/resize, running-upgrade, NSIS install, and process-cleanup uninstall gates pass; the full AMD/Intel/NVIDIA Medal performance matrix is still pending."
