name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.2.12
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          $NsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path -LiteralPath (Join-Path $NsisDirectory 'makensis.exe'))) {
            throw "Chocolatey did not install makensis.exe below $NsisDirectory"
          }
          $NsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test NSIS installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version '${{ inputs.version }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wreath-${{ inputs.version }}-Windows-x64
          path: |
            dist/windows/Wreath-${{ inputs.version }}-x64-setup.exe
            dist/windows/Wreath-${{ inputs.version }}-x64-build.json
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $Tag = "v$env:RELEASE_VERSION"
          gh release create $Tag `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-setup.exe" `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-build.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Wreath $env:RELEASE_VERSION" `
            --notes "Windows x64 NSIS microphone-quality hotfix, continuing 0.2.11. Capture packets were stamped with WASAPI's raw per-packet QPC reading. That is a wall-clock sample taken when the endpoint reported its position, so it carries driver and scheduler jitter and drifts against the device crystal, while the frame count in the packet is exact. The AAC encoder derives its output timestamps from its input timestamps, so the encoded timeline wobbled against the 1024-frame payloads it described and the muxer laid the track out accordingly — heard as a continuous gritty edge rather than an occasional click. The frame count now drives the capture timeline; the wall clock is consulted only to start an epoch and to resynchronize after a real gap, which is also counted. Diagnostics now reach a file. Both Windows binaries are linked for the GUI subsystem and have no console, so every capture diagnostic written to stderr since the feature was added has been discarded — which is why the previous microphone hotfixes were unverifiable. Wreath now appends the negotiated endpoint format, the Windows audio effects the driver still applies, the encoder's input and output format, and a periodic health line carrying the endpoint clock offset and the discontinuity, timestamp-error, queue-drop and resynchronization counters to %LOCALAPPDATA%\\Wreath\\wreath.log, restarted past 1 MB. Attach that file when reporting an audio problem. Native Windows tests, clippy, release builds, application launch/resize, running-upgrade, NSIS install, and process-cleanup uninstall gates pass; the full AMD/Intel/NVIDIA Medal performance matrix is still pending."
