name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.2.18
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          $NsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path -LiteralPath (Join-Path $NsisDirectory 'makensis.exe'))) {
            throw "Chocolatey did not install makensis.exe below $NsisDirectory"
          }
          $NsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test NSIS installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version '${{ inputs.version }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wreath-${{ inputs.version }}-Windows-x64
          path: |
            dist/windows/Wreath-${{ inputs.version }}-x64-setup.exe
            dist/windows/Wreath-${{ inputs.version }}-x64-build.json
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $Tag = "v$env:RELEASE_VERSION"
          gh release create $Tag `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-setup.exe" `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-build.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Wreath $env:RELEASE_VERSION" `
            --notes "Windows x64 NSIS release fixing clip length and capping the frame rate. A 30 second replay was coming out at 24 seconds. The buffer trims by whole groups of pictures, and it dropped one whenever the buffer sat over the target duration - but a hardware encoder's real group is several seconds long, so each drop took the clip well under what was configured. A group is now only dropped while what remains still covers the target, so a saved clip runs from its configured duration up to one group longer and is never shorter. Capture frame rates above 60 are no longer offered. Hardware encoders could not sustain them at the resolutions people record at, so the higher choices produced dropped frames and a picture that held still, while doubling clip size for no visible gain. Configurations written by older builds are brought down to 60 on load rather than rejected, because a rejected configuration would stop the recorder from starting for exactly the people whose settings need changing. Native Windows tests, clippy, release builds, application launch/resize, running-upgrade, NSIS install, and process-cleanup uninstall gates pass; the full AMD/Intel/NVIDIA Medal performance matrix is still pending."
