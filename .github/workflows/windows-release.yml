name: Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 0.2.14
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version 3.12.0 --yes --no-progress
          $NsisDirectory = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path -LiteralPath (Join-Path $NsisDirectory 'makensis.exe'))) {
            throw "Chocolatey did not install makensis.exe below $NsisDirectory"
          }
          $NsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and test NSIS installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version '${{ inputs.version }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Wreath-${{ inputs.version }}-Windows-x64
          path: |
            dist/windows/Wreath-${{ inputs.version }}-x64-setup.exe
            dist/windows/Wreath-${{ inputs.version }}-x64-build.json
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $Tag = "v$env:RELEASE_VERSION"
          gh release create $Tag `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-setup.exe" `
            "dist/windows/Wreath-$env:RELEASE_VERSION-x64-build.json" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Wreath $env:RELEASE_VERSION" `
            --notes "Windows x64 NSIS microphone-quality hotfix, continuing 0.2.13. Capture holes are now bridged instead of spliced. When the endpoint or the queue loses frames, the next packet simply carries a later timestamp; submitting that straight to the AAC encoder joined two unrelated waveforms together while the timeline jumped over the hole, so the encoded frames stopped lining up with the times attached to them. The encoder now fills any hole up to a second with silence, ramping out of the previous packet and back into the next one so neither edge is a step in the waveform, holds the timeline monotonic when a packet overlaps, and restarts cleanly beyond that. Every bridged hole is logged with its length. The muxer rebased clips on the first video packet, which collapsed every audio packet ahead of it onto timestamp zero because the subtraction saturates - a burst of colliding samples at the start of a clip. It now rebases on the earliest packet of either track. Queued microphone packets that overlap after a converter epoch change are no longer mixed into the same frames twice. Raw capture leaves the driver gain control out of the path, so a hot Windows input level now reaches the encoder as hard clipping; clipped samples are counted and reported in the log with the advice to lower the device level. Native Windows tests, clippy, release builds, application launch/resize, running-upgrade, NSIS install, and process-cleanup uninstall gates pass; the full AMD/Intel/NVIDIA Medal performance matrix is still pending."
