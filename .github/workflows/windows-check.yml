name: Windows check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-check.yml"

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: >
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets
          -p wreath-core -p wreath-windows -p wreath-win-ui -p wreathd -p wreathctl
          -- -D warnings

      - name: Test
        run: >
          cargo test --locked --target x86_64-pc-windows-msvc --all-targets
          -p wreath-core -p wreath-windows -p wreath-win-ui -p wreathd -p wreathctl
