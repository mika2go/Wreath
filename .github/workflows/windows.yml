name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint Windows packages
        run: >-
          cargo clippy --locked --all-targets
          -p wreath-core -p wreath-windows -p wreath-win-ui -p wreathd -p wreathctl
          -- -D warnings

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Build and test MSI
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version 0.1.0

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: Wreath-Windows-x64
          path: dist/windows/Wreath-0.1.0-x64.msi
          if-no-files-found: error
